<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Idle RPG</title>
    <meta name="google-adsense-account" content="ca-pub-7139200069286283">
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; }
        .card { background: #222; padding: 20px; border-radius: 15px; border: 1px solid #333; margin-bottom: 20px; }
        .gold { color: #f1c40f; font-size: 2.5rem; font-weight: bold; margin: 10px 0; }
        button { width: 100%; padding: 15px; margin: 8px 0; border: none; border-radius: 10px; font-weight: bold; font-size: 1.1rem; cursor: pointer; }
        .b-mine { background: #f1c40f; color: #000; }
        .b-up { background: #3498db; color: #fff; }
        #log { background: #000; height: 100px; overflow-y: auto; text-align: left; padding: 10px; font-size: 0.8rem; color: #2ecc71; border-radius: 8px; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h3>⛏️ Legendary Miner Knight</h3>
            <div class="gold" id="g">0 G</div>
            <div id="s" style="color:#aaa;">ATK: 1 | Auto: 0/s</div>
        </div>
        <button class="b-mine" onclick="m()">🔨 MINE GOLD</button>
        <button class="b-up" onclick="u()">⚔️ UPGRADE (Cost: <span id="c">10</span>G)</button>
        <div id="log">> Game Re-Initialized.</div>
    </div>
    <script>
        let d = {g:0, a:1, i:0, c:10};
        function update() {
            document.getElementById('g').innerText = Math.floor(d.g).toLocaleString() + ' G';
            document.getElementById('s').innerText = `ATK: ${d.a} | Auto: ${d.i.toFixed(1)}/s`;
            document.getElementById('c').innerText = d.c.toLocaleString();
        }
        function m() { d.g += d.a; addLog('Mined!'); update(); }
        function u() {
            if(d.g >= d.c) { d.g -= d.c; d.a += 1; d.i += 0.5; d.c = Math.floor(d.c * 1.6); addLog('Upgraded!'); update(); }
            else { addLog('Need Gold!'); }
        }
        function addLog(m) { const l = document.getElementById('log'); l.innerHTML = `<div>> ${m}</div>` + l.innerHTML; }
        setInterval(() => { if(d.i > 0) { d.g += d.i; update(); } }, 1000);
        update();
    </script>
</body>
</html>
