<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel Idle RPG</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: 'Apple SD Gothic Neo', sans-serif; text-align: center; margin: 0; padding: 20px; touch-action: manipulation; }
        .stat-card { background: #333; padding: 20px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .gold { color: #ffd700; font-size: 2.5rem; font-weight: bold; margin: 10px 0; }
        .stats { color: #aaa; font-size: 0.9rem; margin-bottom: 10px; }
        button { background: #f1c40f; border: none; padding: 15px 0; font-size: 1.1rem; border-radius: 12px; cursor: pointer; margin: 8px 0; font-weight: bold; width: 100%; box-shadow: 0 4px 0 #bc9c10; }
        button:active { transform: translateY(2px); box-shadow: 0 2px 0 #bc9c10; }
        .upgrade-btn { background: #3498db; box-shadow: 0 4px 0 #2471a3; }
        .ad-btn { background: #e74c3c; box-shadow: 0 4px 0 #c0392b; color: white; margin-top: 20px; }
        .log { background: #000; height: 120px; overflow-y: auto; text-align: left; padding: 15px; font-size: 0.85rem; border-radius: 10px; color: #0f0; margin-top: 20px; border: 1px solid #444; }
        .ad-slot { background: #222; border: 1px dashed #555; padding: 15px; margin: 20px 0; font-size: 0.8rem; color: #777; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="ad-slot">광고 배너 영역 (애드센스 승인 후 노출)</div>
    
    <div class="stat-card">
        <h3>⛏️ 전설의 광부 기사</h3>
        <div class="gold" id="gold-display">0 G</div>
        <div class="stats" id="stat-text">공격력: 1 | 초당 자동 생산: 0</div>
    </div>

    <button onclick="manualClick()">🔨 곡괭이질 하기 (터치!)</button>
    <button class="upgrade-btn" onclick="upgradeAtk()">⚔️ 무기 강화 (Cost: <span id="atk-cost">10</span>G)</button>
    
    <button class="ad-btn" onclick="simulateAd()">📺 광고 보고 수익 2배 버프 (30초)</button>

    <div class="log" id="log-box">게임에 접속했습니다. 황금을 캐보세요!</div>

    <div class="ad-slot">광고 배너 영역 (애드센스 승인 후 노출)</div>

    <script>
        // 게임 상태 관리
        let state = { gold: 0, atk: 1, autoIncome: 0, atkCost: 10 };
        let buffActive = false;

        // 자동 저장 기능 (로컬 스토리지)
        function saveGame() { localStorage.setItem('pixel_idle_save', JSON.stringify(state)); }
        function loadGame() {
            const saved = localStorage.getItem('pixel_idle_save');
            if(saved) {
                state = JSON.parse(saved);
                updateUI();
            }
        }

        function updateUI() {
            document.getElementById('gold-display').innerText = `${Math.floor(state.gold).toLocaleString()} G`;
            document.getElementById('stat-text').innerText = `공격력: ${state.atk} | 초당 자동 생산: ${state.autoIncome.toFixed(1)}`;
            document.getElementById('atk-cost').innerText = state.atkCost.toLocaleString();
            saveGame();
        }

        function manualClick() {
            let gain = state.atk * (buffActive ? 2 : 1);
            state.gold += gain;
            addLog(`곡괭이질! +${gain}G 획득`);
            updateUI();
        }

        function upgradeAtk() {
            if(state.gold >= state.atkCost) {
                state.gold -= state.atkCost;
                state.atk += 1;
                state.autoIncome += 0.5; // 강화 시 자동 생산량도 조금씩 증가
                state.atkCost = Math.floor(state.atkCost * 1.6);
                addLog("무기가 강화되었습니다! 공격력 +1");
                updateUI();
            } else {
                addLog("골드가 부족합니다!");
            }
        }

        function simulateAd() {
            addLog("광고를 시청합니다... (30초간 버프!)");
            buffActive = true;
            setTimeout(() => {
                buffActive = false;
                addLog("버프 시간이 종료되었습니다.");
            }, 30000);
        }

        function addLog(msg) {
            const lb = document.getElementById('log-box');
            const time = new Date().toLocaleTimeString();
            lb.innerHTML = `<div>[${time}] ${msg}</div>` + lb.innerHTML;
        }

        // 초당 자동 생산 실행
        setInterval(() => {
            if (state.autoIncome > 0) {
                state.gold += state.autoIncome;
                updateUI();
            }
        }, 1000);

        // 시작 시 데이터 로드
        loadGame();
    </script>
</body>
</html>
