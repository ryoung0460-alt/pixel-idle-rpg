<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pixel Idle RPG</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7139200069286283" crossorigin="anonymous"></script>
<style>
body{background:#1a1a1a;color:#fff;font-family:sans-serif;text-align:center;margin:0;padding:20px}
.card{background:#222;padding:20px;border-radius:15px;border:1px solid #333;margin-bottom:20px}
#gold{color:#f1c40f;font-size:2.5rem;font-weight:bold;margin:10px 0}
button{width:100%;padding:15px;margin:8px 0;border:none;border-radius:10px;font-weight:bold;font-size:1.1rem;cursor:pointer}
.b1{background:#f1c40f;box-shadow:0 4px 0 #d4ac0d}
.b2{background:#3498db;color:#fff;box-shadow:0 4px 0 #2980b9}
#log{background:#000;height:80px;overflow-y:auto;text-align:left;padding:10px;font-size:0.8rem;color:#2ecc71;border-radius:8px;margin-top:15px}
.info{text-align:left;background:#1a1a1a;padding:20px;border-radius:10px;margin-top:40px;border:1px solid #333;font-size:0.9rem}
</style>
</head>
<body>
<div class="card">
<h3>⛏️ Pixel Miner Global</h3>
<div id="gold">0 G</div>
<div id="stat" style="color:#aaa">ATK: 1 | Auto: 0/s</div>
</div>
<button class="b1" onclick="mine()">🔨 MINE GOLD</button>
<button class="b2" onclick="up()">⚔️ UPGRADE (<span id="cost">10</span>G)</button>
<div id="log">> Game Ready...</div>
<div class="info">
<h2>Global Idle RPG Project</h2>
<p>Strategic mining simulation for global players. Upgrade your knight and reach the top.</p>
<p>© 2026 ryoung0460-alt. All rights reserved.</p>
</div>
<script>
let g=0, a=1, i=0, c=10;
function update(){
document.getElementById('gold').innerText=Math.floor(g).toLocaleString()+' G';
document.getElementById('stat').innerText=`ATK: ${a} | Auto: ${i.toFixed(1)}/s`;
document.getElementById('cost').innerText=c.toLocaleString();
}
function mine(){g+=a;addLog('Mined +'+a+'G');update();}
function up(){
if(g>=c){g-=c;a+=1;i+=0.5;c=Math.floor(c*1.6);addLog('Level Up!');update();}
else{addLog('Need more gold!');}
}
function addLog(m){const l=document.getElementById('log');l.innerHTML=`<div>> ${m}</div>`+l.innerHTML;}
setInterval(()=>{if(i>0){g+=i;update();}},1000);
update();
</script>
</body>
</html>
